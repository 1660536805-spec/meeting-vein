      description: 按 meta_id 列表反查原始论据原文（utt_/agd_/man_ 前缀）。当需要核对某节点证据的原始发言、且置信不足时调用。
      parameters:
        type: object
        properties:
          meta_ids:
            type: array
            items:
              type: string
            description: 要反查的 meta_id 列表
        required:
