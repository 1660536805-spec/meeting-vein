[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-asr-prototype"
version = "0.1.0"
description = "Loopback-only local SenseVoice transcription prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
asr = [
  "funasr>=1.2,<2",
  "modelscope>=1.29,<2",
  "numpy>=2,<3",
  "torch>=2.7,<3",
  "torchaudio>=2.7,<3",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-ra"
