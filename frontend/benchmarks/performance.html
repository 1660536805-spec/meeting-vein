<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>看板性能基准（本地合成样本）</title>
    <style>
      :root { color-scheme: dark; font: 15px/1.55 system-ui, sans-serif; background: #0b1b2e; color: #f2efe4; }
      body { margin: 0; padding: 24px; }
      button { margin: 0 8px 12px 0; padding: 9px 14px; border: 1px solid #60748d; border-radius: 8px; background: #172a42; color: inherit; cursor: pointer; }
      #bench-board { width: min(1200px, 100%); height: 620px; overflow: hidden; border: 1px solid #344c69; border-radius: 12px; }
      #results { white-space: pre-wrap; font-variant-numeric: tabular-nums; }
      .note { max-width: 900px; color: #c5d1df; }
    </style>
  </head>
  <body class="decision-workspace">
    <h1>看板性能基准</h1>
    <p class="note">仅在本地开发服务器运行。节点是合成的中文讨论文本，不是真实会议。测量真实工作台图谱渲染与 SVG 序列化，不会下载文件，也不会修改会议数据。</p>
    <button id="run">运行 10 / 200 / 500 句基准</button>
    <button id="reload">测量浏览器刷新</button>
    <pre id="results">等待测量。</pre>
    <div id="bench-board" aria-label="合成性能基准图谱"></div>
    <script type="module" src="./performance.ts"></script>
  </body>
</html>
